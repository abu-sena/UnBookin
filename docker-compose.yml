name: unbookin
services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: unbookin
      POSTGRES_PASSWORD: unbookin
      POSTGRES_DB: unbookin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unbookin -d unbookin']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
